[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Benchmarks live in benchmarks/ and are excluded from the default run because
# they measure performance rather than correctness. Run them explicitly with:
#   pytest benchmarks --benchmark-only
addopts =
    --strict-markers
    -ra

markers =
    network: requires internet access (Pangeo catalog, Zenodo data download). Skipped unless --network is passed or STITCHES_TEST_NETWORK=1 is set.
    slow: long-running test (>30s wall clock). Skipped unless --slow is passed or STITCHES_TEST_SLOW=1 is set.
    package_data: requires the full Zenodo-minted package data to be installed.
    regression: golden-output invariance test; asserts scientific outputs are unchanged.
    benchmark: performance measurement, not a correctness assertion.

filterwarnings =
    default
